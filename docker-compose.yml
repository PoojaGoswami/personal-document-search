services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: document-search-db

    environment:
      POSTGRES_DB: document_search
      POSTGRES_USER: docsearch
      POSTGRES_PASSWORD: change_this_password

    ports:
      - "5433:5432"

    volumes:
      - document_search_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  document_search_data: